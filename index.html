<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Our Home</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#2b2d2f;--mute:#7a7d80;--line:#ebe6dc;--sage:#7d9a82;--sage-d:#5f7d64;--sage-l:#e6eee6;--red:#b5524a;--amber:#c28a3a;--sh:0 1px 3px rgba(0,0,0,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1d1e;--card:#27282a;--ink:#efece6;--mute:#9a9c9e;--line:#38393b;--sage:#8fb095;--sage-d:#a6c6ab;--sage-l:#2e3a30;--sh:none}}
:root[data-theme="dark"]{--bg:#1c1d1e;--card:#27282a;--ink:#efece6;--mute:#9a9c9e;--line:#38393b;--sage:#8fb095;--sage-d:#a6c6ab;--sage-l:#2e3a30;--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
#app{max-width:640px;margin:0 auto;padding:20px 16px 110px}
h1{font-size:30px;margin:8px 0 2px;letter-spacing:-.5px}
.sub{color:var(--mute);margin:0 0 18px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);margin:24px 4px 8px}
.card{background:var(--card);border-radius:18px;box-shadow:var(--sh);border:1px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:14px 10px;text-align:center;cursor:pointer}
.stat b{display:block;font-size:30px;letter-spacing:-1px}
.stat span{font-size:13px;color:var(--mute)}
.stat.od b{color:var(--red)}.stat.dn b{color:var(--sage-d)}
.task{display:flex;gap:12px;align-items:flex-start;padding:14px;margin-bottom:10px}
.chk{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--sage);background:none;color:#fff;font-size:18px;cursor:pointer;padding:0}
.done .chk{background:var(--sage)}
.tb{flex:1;min-width:0;cursor:pointer}
.tt{font-weight:600}.done .tt{text-decoration:line-through;color:var(--mute)}
.td{color:var(--mute);font-size:14px;margin-top:2px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{font-size:12.5px;padding:3px 10px;border-radius:99px;background:var(--sage-l);color:var(--sage-d)}
.pill.red{background:#f6e3e0;color:var(--red)}.pill.amb{background:#f7ecd8;color:var(--amber)}.pill.gr{background:var(--line);color:var(--mute)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.red{background:#44292a}:root:not([data-theme="light"]) .pill.amb{background:#40351f}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}
.chip{flex:none;min-height:44px;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.chip.on{background:var(--sage);border-color:var(--sage);color:#fff}
select,input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:48px}
textarea{min-height:80px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.empty{text-align:center;padding:36px 20px;color:var(--mute)}.empty big{display:block;font-size:40px}
.wl{padding:14px;margin-bottom:10px}
.wl .h{display:flex;justify-content:space-between;font-weight:600}
.bar{height:8px;border-radius:9px;background:var(--line);margin:10px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sage);border-radius:9px}
.note{font-size:13px;color:var(--mute)}
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;max-width:150px;min-height:48px;border:0;background:none;color:var(--mute);font:inherit;font-size:13px;border-radius:12px;cursor:pointer}
nav button.on{color:var(--sage-d);font-weight:600;background:var(--sage-l)}
.fab{position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:0;background:var(--sage-d);color:#fff;font-size:32px;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer}
.btn{min-height:50px;width:100%;border-radius:14px;border:0;background:var(--sage-d);color:#fff;font:inherit;font-weight:600;cursor:pointer;margin-top:10px}
.btn.alt{background:var(--sage-l);color:var(--sage-d)}.btn.del{background:none;color:var(--red)}
#sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:9}
#sheetbg.on{display:flex}
#sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
label{display:block;font-size:13px;color:var(--mute);margin:14px 4px 6px}
.nm{display:flex;gap:10px;align-items:center;margin-bottom:10px}.nm span{width:70px;color:var(--mute);font-size:14px}
#toast{position:fixed;left:16px;right:16px;bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;font-size:14px;display:none;z-index:20}#toast.on{display:block}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<div id="toast"></div>
<div id="sheetbg"><div id="sheet"></div></div>
<script>
const SB=supabase.createClient('https://madpwmgnjqeanysudqus.supabase.co','sb_publishable_XCS1_8dhvn6nkWOzE4pB9w_VgZjzISM');
//LOGIC
const PRI={high:3,med:2,low:1};
function iso(d){const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
function today(){return iso(new Date())}
function plus(n){const d=new Date();d.setDate(d.getDate()+n);return iso(d)}
function plusFrom(s,n){const[y,m,d]=s.split('-').map(Number);return iso(new Date(y,m-1,d+n))}
function statusOf(t,now){if(t.done)return'done';if(t.due&&t.due<now)return'overdue';return'open'}
function filterTasks(ts,f,now){return ts.filter(t=>{
 if(f.who!=='all'&&t.who!==f.who)return false;
 const s=statusOf(t,now);
 if(f.status==='open'&&s==='done')return false;
 if(f.status==='overdue'&&s!=='overdue')return false;
 if(f.status==='done'&&s!=='done')return false;
 if(f.due==='today'&&t.due!==now)return false;
 if(f.due==='week'&&!(t.due&&t.due>=now&&t.due<=plusFrom(now,7)))return false;
 if(f.due==='none'&&t.due)return false;
 return true}).sort((a,b)=>(a.done-b.done)||((a.due||'9999')<(b.due||'9999')?-1:(a.due||'9999')>(b.due||'9999')?1:0)||(PRI[b.pri]-PRI[a.pri]))}
function workload(ts,now,ids){const w={};ids.forEach(i=>w[i]={open:0,overdue:0,done:0,share:0});
 ts.forEach(t=>{if(!w[t.who])return;const s=statusOf(t,now);if(s==='done')w[t.who].done++;else{w[t.who].open++;if(s==='overdue')w[t.who].overdue++}});
 const people=ids.filter(i=>i!=='shared');const tot=people.reduce((a,i)=>a+w[i].open,0);
 people.forEach(i=>w[i].share=tot?Math.round(100*w[i].open/tot):0);return w}
function fromRow(r){return{id:r.id,title:r.title,desc:r.description||'',due:r.due||'',pri:r.priority,who:r.assignee,done:r.done}}
function toRow(f){return{title:f.title,description:f.desc||'',due:f.due||null,priority:f.pri,assignee:f.who}}
//ENDLOGIC

let S={tasks:[],names:{shared:'Shared'},ids:['shared'],me:'',session:null,denied:false,loading:true};
let UI={tab:'home',f:{who:'all',status:'open',due:'any'},edit:null};
let chan=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nm=i=>S.names[i]||'Unassigned';
function say(m){const e=$('#msg');if(e)e.textContent=m}
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),4000)}
async function fetchTasks(){const r=await SB.from('tasks').select('*').order('created_at',{ascending:false});if(r.error){toast(r.error.message);return}S.tasks=r.data.map(fromRow);render()}
async function boot(session){S.session=session;
 if(!session){S.tasks=[];S.loading=false;render();return}
 const m=await SB.from('family_members').select('email,name').order('name');
 if(m.error||!m.data||!m.data.length){S.denied=true;S.loading=false;render();return}
 S.denied=false;S.me=(session.user.email||'').toLowerCase();S.names={shared:'Shared'};
 S.ids=m.data.map(x=>x.email.toLowerCase()).concat('shared');m.data.forEach(x=>S.names[x.email.toLowerCase()]=x.name);
 await fetchTasks();S.loading=false;render();
 if(!chan)chan=SB.channel('tasks').on('postgres_changes',{event:'*',schema:'public',table:'tasks'},fetchTasks).subscribe()}
async function run(p){const r=await p;if(r.error)toast(r.error.message);await fetchTasks()}
function nice(d){if(!d)return'No date';const n=today();if(d===n)return'Today';if(d===plus(1))return'Tomorrow';if(d===plus(-1))return'Yesterday';const[y,m,dd]=d.split('-').map(Number);return new Date(y,m-1,dd).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}
function card(t){const s=statusOf(t,today());return`<div class="card task ${t.done?'done':''}"><button class="chk" data-tog="${t.id}" aria-label="Toggle complete">${t.done?'✓':''}</button><div class="tb" data-edit="${t.id}"><div class="tt">${esc(t.title)}</div>${t.desc?`<div class="td">${esc(t.desc)}</div>`:''}<div class="meta"><span class="pill">${esc(nm(t.who))}</span><span class="pill ${s==='overdue'?'red':'gr'}">${s==='overdue'?'Overdue · ':''}${nice(t.due)}</span>${t.pri==='high'?'<span class="pill amb">High</span>':t.pri==='low'?'<span class="pill gr">Low</span>':''}</div></div></div>`}
function empty(ic,h,p){return`<div class="card empty"><big>${ic}</big><b>${h}</b><p>${p}</p></div>`}
function chips(sel,attr,opts){return`<div class="chips">${opts.map(o=>`<button class="chip ${sel===o[0]?'on':''}" data-${attr}="${o[0]}">${esc(o[1])}</button>`).join('')}</div>`}
function render(){
 const now=today(),ts=S.tasks;let h='',main=false;
 if(S.loading){h='<h1>Our Home</h1><p class="sub">Loading…</p>'}
 else if(!S.session){h=`<h1>Our Home</h1><p class="sub">Sign in with your family email to see the shared tasks.</p><div class="card" style="padding:16px"><label style="margin-top:0">Email</label><input id="em" type="email" inputmode="email" autocapitalize="off" autocomplete="email" placeholder="you@example.com"><label>Password</label><input id="pw" type="password" autocomplete="current-password" placeholder="Password"><button class="btn" id="send">Sign in</button><button class="btn alt" id="link">Email me a sign-in link instead</button><p class="note" id="msg" style="margin:10px 2px 0"></p></div>`}
 else if(S.denied){h=`<h1>Our Home</h1><div class="card empty"><big>🔒</big><b>This email isn't on the family list</b><p>Signed in as ${esc(S.session.user.email||'')}. Ask the person who set this up to add it.</p></div><button class="btn alt" id="signout">Sign out</button>`}
 else{main=true;
 const open=ts.filter(t=>statusOf(t,now)==='open').length,od=ts.filter(t=>statusOf(t,now)==='overdue').length,dn=ts.filter(t=>t.done).length;
 if(UI.tab==='home'){
  const up=filterTasks(ts,{who:'all',status:'open',due:'any'},now).slice(0,5);
  h=`<h1>Our Home</h1><p class="sub">${new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</p>
  <div class="stats"><div class="card stat" data-go="open"><b>${open}</b><span>Open</span></div><div class="card stat od" data-go="overdue"><b>${od}</b><span>Overdue</span></div><div class="card stat dn" data-go="done"><b>${dn}</b><span>Done</span></div></div>
  <h2>Up next</h2>${up.length?up.map(card).join(''):empty('🌿',ts.length?'All caught up':'No tasks yet','Tap + to add the first one. Everyone sees it right away.')}`}
 if(UI.tab==='tasks'){
  const f=UI.f,list=filterTasks(ts,f,now);
  h=`<h1>Tasks</h1><p class="sub">${list.length} shown</p>
  ${chips(f.who,'who',[['all','Everyone']].concat(S.ids.map(i=>[i,nm(i)])))}
  ${chips(f.status,'st',[['open','Open'],['overdue','Overdue'],['done','Done'],['all','All']])}
  <div class="row"><select id="fdue"><option value="any">Any due date</option><option value="today">Due today</option><option value="week">Next 7 days</option><option value="none">No date</option></select><span></span></div>
  <div style="height:10px"></div>${list.length?list.map(card).join(''):empty('🔍','No matching tasks','Try a different filter or add a new task.')}`}
 if(UI.tab==='family'){
  const w=workload(ts,now,S.ids);
  h=`<h1>Family</h1><p class="sub">Who's carrying what</p><h2>Workload</h2>`+S.ids.map(i=>`<div class="card wl"><div class="h"><span>${esc(nm(i))}</span><span>${w[i].open} open</span></div>${i!=='shared'?`<div class="bar"><i style="width:${w[i].share}%"></i></div>`:'<div style="height:10px"></div>'}<div class="note">${i!=='shared'?w[i].share+'% of assigned open tasks · ':''}${w[i].overdue} overdue · ${w[i].done} done</div></div>`).join('')+
  `<p class="note" style="margin:4px 6px">Shared tasks aren't counted in the percentages.</p>
  <h2>Coming later</h2><div class="card" style="padding:14px"><b>Recurring chores</b><div class="note">Weekly and daily repeats (like trash night) are planned next.</div></div>
  <h2>Account</h2><div class="card" style="padding:14px"><div class="note">Signed in as ${esc(S.session.user.email||'')}</div></div><button class="btn alt" id="signout">Sign out</button>`}}
 $('#app').innerHTML=h+(main&&UI.tab!=='family'?'<button class="fab" id="add" aria-label="Add task">+</button>':'');
 $('#nav').innerHTML=main?[['home','🏡 Home'],['tasks','✅ Tasks'],['family','👪 Family']].map(a=>`<button class="${UI.tab===a[0]?'on':''}" data-tab="${a[0]}">${a[1]}</button>`).join(''):'';
 const fd=$('#fdue');if(fd)fd.value=UI.f.due}
function openSheet(id){
 const t=id?S.tasks.find(x=>x.id===id):{title:'',desc:'',due:'',pri:'med',who:S.ids.includes(S.me)?S.me:'shared',done:false};UI.edit={id:id||null,who:t.who,pri:t.pri};
 $('#sheet').innerHTML=`<h1 style="font-size:24px">${id?'Edit task':'New task'}</h1>
 <label>Title</label><input id="f-title" value="${esc(t.title)}" placeholder="e.g. Take out the trash">
 <label>Notes</label><textarea id="f-desc" placeholder="Optional details">${esc(t.desc)}</textarea>
 <label>Due date</label><input id="f-due" type="date" value="${t.due}">
 <label>Priority</label><div class="chips" id="f-pri">${[['low','Low'],['med','Medium'],['high','High']].map(p=>`<button class="chip ${t.pri===p[0]?'on':''}" data-p="${p[0]}">${p[1]}</button>`).join('')}</div>
 <label>Assigned to</label><div class="chips" id="f-who" style="flex-wrap:wrap">${S.ids.map(i=>`<button class="chip ${t.who===i?'on':''}" data-w="${i}">${esc(nm(i))}</button>`).join('')}</div>
 <button class="btn" id="f-save">${id?'Save changes':'Add task'}</button>
 ${id?`<button class="btn alt" id="f-done">${t.done?'Reopen task':'Mark complete'}</button><button class="btn del" id="f-del">Delete task</button>`:''}
 <button class="btn alt" id="f-x">Cancel</button>`;
 $('#sheetbg').classList.add('on')}
function closeSheet(){$('#sheetbg').classList.remove('on');UI.edit=null}
function saveSheet(){const f={title:$('#f-title').value.trim(),desc:$('#f-desc').value.trim(),due:$('#f-due').value,pri:UI.edit.pri,who:UI.edit.who};
 if(!f.title){$('#f-title').focus();return}
 const id=UI.edit.id;closeSheet();
 run(id?SB.from('tasks').update(toRow(f)).eq('id',id):SB.from('tasks').insert(toRow(f)))}
function toggle(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;t.done=!t.done;render();run(SB.from('tasks').update({done:t.done}).eq('id',id))}
async function signIn(){const em=$('#em').value.trim().toLowerCase(),pw=$('#pw').value;if(!em||!pw){say('Enter your email and password.');return}
 $('#send').disabled=true;say('Signing in…');const r=await SB.auth.signInWithPassword({email:em,password:pw});
 const b=$('#send');if(b)b.disabled=false;say(r.error?r.error.message:'')}
async function sendLink(){const em=$('#em').value.trim().toLowerCase();if(!em){say('Enter your email first.');return}
 $('#send').disabled=true;say('Sending…');
 const r=await SB.auth.signInWithOtp({email:em,options:{emailRedirectTo:location.origin+location.pathname}});
 const b=$('#send');if(b)b.disabled=false;say(r.error?r.error.message:'Check your email and tap the link. Open it in Safari.')}
document.addEventListener('click',e=>{
 const g=a=>e.target.closest('['+a+']');let x;
 if(x=g('data-tog'))return toggle(x.dataset.tog);
 if(x=g('data-edit'))return openSheet(x.dataset.edit);
 if(e.target.closest('#add'))return openSheet();
 if(x=g('data-tab')){UI.tab=x.dataset.tab;return render()}
 if(x=g('data-go')){UI.f={who:'all',status:x.dataset.go,due:'any'};UI.tab='tasks';return render()}
 if(x=g('data-who')){UI.f.who=x.dataset.who;return render()}
 if(x=g('data-st')){UI.f.status=x.dataset.st;return render()}
 if(x=g('data-p')){UI.edit.pri=x.dataset.p;document.querySelectorAll('#f-pri .chip').forEach(c=>c.classList.toggle('on',c===x));return}
 if(x=g('data-w')){UI.edit.who=x.dataset.w;document.querySelectorAll('#f-who .chip').forEach(c=>c.classList.toggle('on',c===x));return}
 if(e.target.id==='f-save')return saveSheet();
 if(e.target.id==='f-x'||e.target.id==='sheetbg')return closeSheet();
 if(e.target.id==='f-done'){const id=UI.edit.id;closeSheet();return toggle(id)}
 if(e.target.id==='f-del'){const id=UI.edit.id;closeSheet();return run(SB.from('tasks').delete().eq('id',id))}
 if(e.target.id==='send')return signIn();
 if(e.target.id==='link')return sendLink();
 if(e.target.id==='signout')return SB.auth.signOut();
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pw')signIn()});
document.addEventListener('change',e=>{if(e.target.id==='fdue'){UI.f.due=e.target.value;render()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.session&&!S.denied)fetchTasks()});
render();
SB.auth.onAuthStateChange((ev,s)=>{if(ev==='TOKEN_REFRESHED')return;setTimeout(()=>boot(s),0)});
</script>
</body>
</html>
